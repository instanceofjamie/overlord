# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "overlord-director"
version = "0.1.0"
description = "Local-first OVERLORD mission observation director"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
overlord = "overlord.cli:main"
overlord-simulate = "overlord.simulate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overlord"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
