# SPDX-License-Identifier: Apache-2.0
name: Windows observation demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: cmake -S bridge -B build/windows -A x64
      - run: cmake --build build/windows --config Release
      - run: ctest --test-dir build/windows -C Release --output-on-failure
      - run: python tools/test_bridge.py build/windows/Release
      - run: ./tools/test_install.ps1 -DllPath build/windows/Release/overlord_bridge_x64.dll
      - name: Package demo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/demo/@OVERLORD,build/demo/tools,build/demo/docs | Out-Null
          Copy-Item build/windows/Release/overlord_bridge_x64.dll build/demo/@OVERLORD/
          Copy-Item missions build/demo/ -Recurse
          Copy-Item tools/install-demo.ps1 build/demo/tools/
          Copy-Item docs/local-demo.md,docs/transport-local.md,docs/architecture.md,docs/verification.md build/demo/docs/
          Copy-Item LICENSE build/demo/
          Get-FileHash build/demo/@OVERLORD/overlord_bridge_x64.dll | Format-List | Out-File build/demo/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: overlord-windows-observation-demo
          path: build/demo/
          if-no-files-found: error
